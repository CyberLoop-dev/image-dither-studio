<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Image Dither Studio</title><style>:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#0b1220;color:#e8eef8}*{box-sizing:border-box}body{max-width:1100px;margin:auto;padding:32px}h1{font-size:clamp(2rem,5vw,3.2rem)}p{color:#aab9cc;line-height:1.6}.panel{background:#121e32;border:1px solid #293b59;border-radius:16px;padding:18px;margin:16px 0}.controls{display:flex;gap:14px;flex-wrap:wrap;align-items:end}label{display:grid;gap:7px;color:#c4d2e5}input,select{background:#07101e;color:#e2e8f0;border:1px solid #405574;border-radius:9px;padding:10px}button{background:#2563eb;color:white;border:0;border-radius:9px;padding:11px 15px;font-weight:700;cursor:pointer}canvas{max-width:100%;display:block;margin:20px auto;background:#07101e;border-radius:10px}small{color:#94a8c3}</style></head><body><p>LOCAL IMAGE PROCESSING · CANVAS</p><h1>Image Dither Studio</h1><p>Turn smooth gradients into retro-style pixel patterns using ordered and error-diffusion dithering.</p><section class="panel"><div class="controls"><label>Image<input id="file" type="file" accept="image/*"></label><label>Algorithm<select id="method"><option value="floyd">Floyd–Steinberg</option><option value="bayer">Ordered Bayer 4×4</option></select></label><label>Levels <input id="levels" type="range" min="2" max="8" value="2"></label><button id="apply" disabled>Apply dither</button><button id="download" disabled>Download PNG</button></div><canvas id="canvas" width="800" height="500"></canvas><small>Images are decoded and processed locally in this browser tab.</small></section><script>const $=s=>document.querySelector(s),canvas=$("#canvas"),ctx=canvas.getContext("2d",{willReadFrequently:true});let source=null;const bayer=[[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];function quant(v,levels){const step=255/(levels-1);return Math.round(v/step)*step}function run(){if(!source)return;const img=new ImageData(new Uint8ClampedArray(source.data),source.width,source.height),d=img.data,levels=Number($("#levels").value),method=$("#method").value;if(method==="bayer"){for(let y=0;y<img.height;y++)for(let x=0;x<img.width;x++){const i=(y*img.width+x)*4,t=(bayer[y%4][x%4]/16-.5)*(255/levels);for(let c=0;c<3;c++)d[i+c]=quant(Math.max(0,Math.min(255,d[i+c]+t)),levels)}}else{for(let y=0;y<img.height;y++)for(let x=0;x<img.width;x++){const i=(y*img.width+x)*4;for(let c=0;c<3;c++){const old=d[i+c],next=quant(old,levels),err=old-next;d[i+c]=next;if(x+1<img.width)d[i+4+c]+=err*7/16;if(y+1<img.height){if(x>0)d[i+(img.width-1)*4+c]+=err*3/16;d[i+img.width*4+c]+=err*5/16;if(x+1<img.width)d[i+(img.width+1)*4+c]+=err/16}}}}canvas.width=img.width;canvas.height=img.height;ctx.putImageData(img,0,0);$("#download").disabled=false}$("#file").onchange=e=>{const f=e.target.files[0];if(!f)return;const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{canvas.width=im.naturalWidth;canvas.height=im.naturalHeight;ctx.drawImage(im,0,0);source=ctx.getImageData(0,0,canvas.width,canvas.height);$("#apply").disabled=false;$("#download").disabled=true;URL.revokeObjectURL(u)};im.src=u};$("#apply").onclick=run;$("#method").onchange=()=>{if(source)run()};$("#levels").oninput=()=>{if(source)run()};$("#download").onclick=()=>{const a=document.createElement("a");a.download="dithered.png";a.href=canvas.toDataURL("image/png");a.click()};</script></body></html>
